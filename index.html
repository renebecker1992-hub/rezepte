/* ------------------------------------------------------------------ */
/* Design tokens                                                       */
/* ------------------------------------------------------------------ */

const COLORS = {
  bg: "#D9D3C1",
  card: "#F6F2E7",
  cardAlt: "#EFE8D6",
  ink: "#2B2620",
  inkSoft: "#5B5344",
  line: "#C7BEA5",
  kochen: "#28463A",
  kochenSoft: "#DCE6DE",
  backen: "#6B3626",
  backenSoft: "#EADAD1",
  accent: "#B9862E",
  accentSoft: "#F1E3C2",
  danger: "#9B3B34",
};

const FONTS = {
  display: "'Fraunces', Georgia, serif",
  body: "'IBM Plex Sans', system-ui, sans-serif",
  mono: "'IBM Plex Mono', ui-monospace, monospace",
};

const CATEGORY_PALETTE = [
  COLORS.kochen,
  COLORS.backen,
  "#3A5A78",
  "#5C4A72",
  "#3E6B5C",
  "#7A5A2E",
];

const INPUT_STYLE = {
  background: COLORS.cardAlt,
  border: `1px solid ${COLORS.line}`,
  color: COLORS.ink,
  fontFamily: FONTS.body,
};

const DEFAULT_CATEGORIES = ["Kochen", "Backen"];

// Einziger Storage-Key: die komplette Kartei liegt als ein JSON-Blob hier.
// Ein einzelner Key statt vieler Einzel-Keys reduziert die Zahl der
// Storage-Aufrufe (und damit die Fehlerfläche) deutlich.
const DATA_KEY = "recipe-app-data";

// Rezepte, die per Chat mit Claude besorgt werden, liegen NICHT mehr fest im
// Code, sondern in der separaten Datei recipes.json (gleiches Verzeichnis).
// So bleibt index.html (die App-Logik) stabil – für ein neues Rezept ändert
// sich nur die kleine JSON-Datei, nicht das ganze Programm. Wird beim Start
// geladen und automatisch angelegt, falls sourceUrl/Titel noch nicht in der
// Kartei sind – mehrfaches Öffnen erzeugt also keine Duplikate.
async function loadPendingImports() {
  try {
    const res = await fetch("./recipes.json", { cache: "no-store" });
    if (!res.ok) return [];
    const data = await res.json();
    return Array.isArray(data) ? data : [];
  } catch (e) {
    return [];
  }
}

/* ------------------------------------------------------------------ */
/* Utilities                                                           */
/* ------------------------------------------------------------------ */

function uid(prefix) {
  return (
    (prefix || "id") +
    "_" +
    Date.now().toString(36) +
    "_" +
    Math.random().toString(36).slice(2, 8)
  );
}

function formatDate(iso) {
  if (!iso) return "";
  try {
    return new Date(iso).toLocaleDateString("de-DE", {
      day: "2-digit",
      month: "2-digit",
      year: "numeric",
    });
  } catch (e) {
    return "";
  }
}

function todayInputValue() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function computeAvgRating(usageLog) {
  if (!usageLog || usageLog.length === 0) return null;
  const sum = usageLog.reduce((a, e) => a + Number(e.rating || 0), 0);
  return Math.round((sum / usageLog.length) * 10) / 10;
}

function formatAmount(n) {
  if (n === null || n === undefined || Number.isNaN(n)) return null;
  const rounded = Math.round(n * 100) / 100;
  return rounded % 1 === 0 ? String(rounded) : String(parseFloat(rounded.toFixed(2)));
}

function categoryColor(name) {
  if (name === "Kochen") return COLORS.kochen;
  if (name === "Backen") return COLORS.backen;
  let hash = 0;
  for (let i = 0; i < (name || "").length; i++) {
    hash = name.charCodeAt(i) + ((hash << 5) - hash);
  }
  return CATEGORY_PALETTE[Math.abs(hash) % CATEGORY_PALETTE.length];
}

function categorySoft(name) {
  if (name === "Kochen") return COLORS.kochenSoft;
  if (name === "Backen") return COLORS.backenSoft;
  return COLORS.accentSoft;
}

// Grams-Helfer: liefert das Gewicht einer Zutat in g, oder null wenn die
// Einheit keine reine Massenangabe ist (ml, EL, Stück, Range-Text, …).
function ingredientGrams(ing) {
  if (ing.amount == null) return null;
  const u = (ing.unit || "").trim().toLowerCase();
  if (u === "g") return ing.amount;
  if (u === "kg") return ing.amount * 1000;
  return null;
}

// Teigmenge = Summe aller Zutaten mit Gewichtsangabe in g. Zutaten mit
// Range-Mengen (z. B. "100-130 g" als Text im unit-Feld) fließen bewusst
// nicht ein, da sie keinen eindeutigen amount-Wert haben.
function calcDoughWeight(ingredients) {
  let total = 0;
  let any = false;
  for (const ing of ingredients || []) {
    const g = ingredientGrams(ing);
    if (g != null) {
      total += g;
      any = true;
    }
  }
  return any ? Math.round(total) : null;
}

// Hydration (Bäcker-%) = Wasser ÷ Mehl, vereinfacht anhand der Namen
// "wasser" / "mehl" in den Zutaten. Sauerteig/Anstellgut mit unklarer
// Menge fließt nicht ein – daher als Vorschlag gedacht, nicht als exakter Wert.
function calcHydration(ingredients) {
  let water = 0;
  let flour = 0;
  for (const ing of ingredients || []) {
    const g = ingredientGrams(ing);
    if (g == null) continue;
    const name = (ing.name || "").toLowerCase();
    if (name.includes("wasser")) water += g;
    else if (name.includes("mehl")) flour += g;
  }
  if (flour <= 0) return null;
  return Math.round((water / flour) * 1000) / 10;
}

/* ------------------------------------------------------------------ */
/* Rezept-Skalierung: "Menge" (flourFactor) und "Hydration" sind zwei   */
/* unabhängige Regler. Menge/Teigmenge skalieren Mehl + alles außer     */
/* Wasser proportional; Hydration bestimmt NUR die Wassermenge relativ  */
/* zur (bereits skalierten) Mehlmenge. Keiner der Regler setzt den      */
/* anderen zurück – Teigmenge ist lediglich eine zweite Eingabe für     */
/* denselben "Menge"-Faktor, rückgerechnet über die aktuelle Hydration. */
/* ------------------------------------------------------------------ */

// Ordnet eine Zutat einem Eimer zu: "flour"/"water" nur für UNGRUPPIERTE
// Zutaten des Hauptteigs (per Name erkannt). Zutaten, die als Teil eines
// Vorteigs/Quellstücks/etc. gekennzeichnet sind (siehe extractIngredientGroup),
// zählen bewusst NICHT zur Haupt-Hydration – sie skalieren nur mit der Menge,
// unabhängig vom Hydration-Regler (z. B. Quellstück-Wasser für Saaten).
// Ordnet eine Zutat einer Gruppe zu: explizites ing.group hat Vorrang (neues,
// robustes Datenfeld); nur wenn das fehlt, wird als Kompatibilitäts-Fallback
// noch der alte Klammer-Text im Namen ausgewertet (ältere, lokal gespeicherte
// Rezepte ohne group-Feld).
function normalizeIngredient(ing) {
  if (ing.group) return ing;
  const extracted = extractIngredientGroup(ing.name);
  if (extracted) return { ...ing, group: extracted.group, name: extracted.rest };
  return ing;
}

// Ordnet einen Zubereitungsschritt einem Tag zu: neues Format ist ein Objekt
// {text, day}; alte, lokal gespeicherte Rezepte haben stattdessen einen
// reinen String, aus dem der Tag per Text-Erkennung als Fallback abgeleitet wird.
function normalizeStep(s) {
  if (s && typeof s === "object") return { text: s.text || "", day: s.day || null };
  const extracted = extractDayMarker(s);
  if (extracted) return { text: extracted.rest, day: extracted.day };
  return { text: s || "", day: null };
}

// Nur "Quellstück"-Gruppen werden von der Mehl/Wasser-Klassifizierung
// ausgeschlossen (das Wasser dient dort meist zum Einweichen von Saaten,
// nicht zur Teighydration). Andere Teilrezepte wie Sauerteig-Ansatz,
// Vorteig, Kochstück, Brühstück oder Poolish sind selbst Mehl-Wasser-
// Gemische und zählen ganz normal zur Gesamt-Hydration mit dazu.
function classifyIngredient(ing) {
  const g = ingredientGrams(ing);
  if (g == null) return { bucket: "skip", grams: null };
  const name = (ing.name || "").toLowerCase();
  const group = (ing.group || "").trim().toLowerCase();
  if (group !== "quellstück") {
    if (name.includes("mehl")) return { bucket: "flour", grams: g };
    if (name.includes("wasser")) return { bucket: "water", grams: g };
  }
  return { bucket: "other", grams: g };
}

// Basis-Summen (unskaliert) aus den Original-Zutaten. Erwartet bereits
// normalisierte Zutaten (mit explizitem group-Feld, falls zutreffend).
function baseGramsBreakdown(ingredients) {
  let flourTotal = 0;
  let waterTotal = 0;
  let otherTotal = 0;
  for (const ing of ingredients || []) {
    const { bucket, grams } = classifyIngredient(ing);
    if (grams == null) continue;
    if (bucket === "flour") flourTotal += grams;
    else if (bucket === "water") waterTotal += grams;
    else otherTotal += grams;
  }
  return { flourTotal, waterTotal, otherTotal };
}

// Liefert je Zutat einen scaledAmount, gegeben den Mengen-Faktor
// (flourFactor, relativ zur Basisrezeptgröße) und eine Ziel-Hydration
// (Prozent, oder null wenn nicht anwendbar/gewünscht). Erwartet bereits
// normalisierte Zutaten (recipe.ingredients hier = normalisierte Liste).
function computeScaledIngredientsV2(ingredients, flourFactor, targetHydration) {
  const base = ingredients || [];
  const { flourTotal, waterTotal } = baseGramsBreakdown(base);
  const useHydration = targetHydration != null && flourTotal > 0;
  const scaledFlourTotal = flourTotal * flourFactor;
  const targetWaterTotal = useHydration ? (targetHydration / 100) * scaledFlourTotal : null;

  return base.map((ing) => {
    const { bucket, grams } = classifyIngredient(ing);
    if (bucket === "water" && useHydration && waterTotal > 0) {
      const share = grams / waterTotal;
      const newGrams = targetWaterTotal * share;
      const unit = (ing.unit || "").trim().toLowerCase();
      return { ...ing, scaledAmount: unit === "kg" ? newGrams / 1000 : newGrams };
    }
    return { ...ing, scaledAmount: ing.amount != null ? ing.amount * flourFactor : null };
  });
}

// Rechnet aus einer gewünschten Ziel-Teigmenge den passenden flourFactor
// zurück – unter Beibehaltung der aktuell eingestellten Hydration.
// Erwartet bereits normalisierte Zutaten.
function solveFlourFactorForDoughWeight(ingredients, targetWeight, targetHydration) {
  const { flourTotal, otherTotal } = baseGramsBreakdown(ingredients);
  const h = targetHydration != null ? targetHydration : calcHydration(ingredients) || 0;
  const denom = flourTotal * (1 + h / 100) + otherTotal;
  if (denom <= 0 || !(targetWeight > 0)) return 1;
  return targetWeight / denom;
}

// Summiert die scaledAmount-Werte (nur g/kg) zur angezeigten Gesamt-Teigmenge.
function sumScaledGrams(scaledIngredients) {
  let total = 0;
  let any = false;
  for (const i of scaledIngredients) {
    if (i.scaledAmount == null) continue;
    const u = (i.unit || "").trim().toLowerCase();
    if (u === "g") {
      total += i.scaledAmount;
      any = true;
    } else if (u === "kg") {
      total += i.scaledAmount * 1000;
      any = true;
    }
  }
  return any ? Math.round(total) : null;
}

// Erkennt einen Tag-Marker am Anfang eines Zubereitungsschritts (z. B.
// "Tag 1, 10:00 Uhr: ..." oder "Am nächsten Tag: ...") – dient nur noch als
// Kompatibilitäts-Fallback für älteres String-Format (siehe normalizeStep).
function extractDayMarker(text) {
  const m = (text || "").match(/^(Tag\s*\d+|Am\s+(?:über)?nächsten\s+Tag)\s*[,:]?\s*/i);
  if (!m) return null;
  return { day: m[1].trim(), rest: text.slice(m[0].length).trim() };
}

// Erkennt eine Teilrezept-Gruppe am Ende eines Zutatennamens in Klammern –
// dient nur noch als Kompatibilitäts-Fallback für älteres Format ohne
// explizites group-Feld (siehe normalizeIngredient).
function extractIngredientGroup(name) {
  const m = (name || "").match(/\((?:für\s+|zum\s+)?(Quellstück|Hauptteig|Vorteig|Brühstück|Poolish)[^()]*\)\s*$/i);
  if (!m) return null;
  return { group: m[1], rest: name.slice(0, m.index).trim() };
}

// Verkleinert & komprimiert ein Foto clientseitig auf ein Data-URL-JPEG,
// damit Bewertungsfotos klein genug für den Storage-Blob bleiben.
function compressImageFile(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Datei konnte nicht gelesen werden."));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Bild konnte nicht geladen werden."));
      img.onload = () => {
        let { width, height } = img;
        const scale = Math.min(1, (maxDim || 900) / Math.max(width, height));
        width = Math.max(1, Math.round(width * scale));
        height = Math.max(1, Math.round(height * scale));
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality || 0.7));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ------------------------------------------------------------------ */
/* AI-Extraktion (Anthropic API, im Artifact-Sandbox verfügbar)        */
/* ------------------------------------------------------------------ */

const PARSE_SYSTEM_PROMPT = `Du extrahierst Kochrezepte aus unstrukturiertem Text (z. B. von einer Rezept-Webseite kopiert). Antworte AUSSCHLIESSLICH mit einem validen JSON-Objekt, ohne Markdown-Codeblock, ohne Erklärungen davor oder danach.

Format exakt so:
{"title": string, "author": string oder null, "category": "Kochen" oder "Backen", "baseServings": number, "servingsUnit": string, "timeOverview": string oder null, "ingredients": [{"amount": number oder null, "unit": string, "name": string, "group": string oder null}], "steps": [{"text": string, "day": string oder null}]}

Regeln:
- "author": Name der Person/des Blogs, von dem das Rezept stammt, falls erkennbar (z. B. Autor:in des Blogs oder Buchs); sonst null.
- "category": wähle "Backen" für Kuchen, Brot, Gebäck, süße Backwaren; sonst "Kochen".
- "baseServings": Anzahl Portionen/Stück laut Text; wenn nicht eindeutig angegeben, schätze sinnvoll (z. B. 4).
- "servingsUnit": z. B. "Portionen", "Stück", "Brote", "Personen".
- "timeOverview": knappe 1-2 Sätze, wie viel Zeit pro Tag/Abschnitt eingeplant werden muss (z. B. "Tag 1: ca. 5 Std. aktiv + Übernachtgare. Tag 2: ca. 1,5 Std."). Nur befüllen, wenn sich das aus dem Text sinnvoll ableiten lässt, sonst null.
- "amount": wenn keine klare Zahl vorhanden ist (z. B. "etwas", "nach Geschmack", "1 Prise"), setze amount auf null und beschreibe die Menge im "unit"-Feld.
- "group": NUR setzen, wenn die Zutat laut Text explizit zu einem separaten Teilrezept gehört (z. B. "Quellstück", "Vorteig", "Hauptteig", "Brühstück", "Poolish"); normale Hauptteig-Zutaten ohne genannte Zugehörigkeit bekommen null.
- "day": NUR beim ERSTEN Schritt eines neuen Tages/Abschnitts setzen (z. B. "Tag 1", "Tag 2"); alle folgenden Schritte desselben Tages bekommen null.
- Fasse "steps" prägnant zusammen, maximal 12 Schritte, keine Werbetexte, Anekdoten oder Vorworte übernehmen.
- Erfinde keine Zutaten, Schritte, Gruppen oder Tage, die nicht im Text vorkommen.`;

async function parseRecipeText(rawText) {
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1400,
      system: PARSE_SYSTEM_PROMPT,
      messages: [{ role: "user", content: rawText.slice(0, 6000) }],
    }),
  });
  if (!response.ok) throw new Error("API-Fehler");
  const data = await response.json();
  const textBlocks = (data.content || [])
    .filter((b) => b.type === "text")
    .map((b) => b.text)
    .join("\n");
  const cleaned = textBlocks.replace(/```json|```/g, "").trim();
  const parsed = JSON.parse(cleaned);
  if (!parsed || typeof parsed !== "object") throw new Error("Ungültige Antwort");
  return parsed;
}

const URL_PARSE_SYSTEM_PROMPT = `Du bekommst eine URL zu einer Rezept-Webseite. Nutze die Websuche, um den Inhalt dieser Seite zu finden, und extrahiere daraus das Rezept. Antworte AUSSCHLIESSLICH mit einem validen JSON-Objekt, ohne Markdown-Codeblock, ohne Erklärungen davor oder danach.

Format exakt so:
{"title": string, "author": string oder null, "category": "Kochen" oder "Backen", "baseServings": number, "servingsUnit": string, "timeOverview": string oder null, "ingredients": [{"amount": number oder null, "unit": string, "name": string, "group": string oder null}], "steps": [{"text": string, "day": string oder null}]}

Regeln:
- "author": Name der Person/des Blogs, von dem das Rezept stammt, falls auf der Seite erkennbar; sonst null.
- "category": wähle "Backen" für Kuchen, Brot, Gebäck, süße Backwaren; sonst "Kochen".
- "baseServings": Anzahl Portionen/Stück laut Seite; wenn nicht eindeutig angegeben, schätze sinnvoll (z. B. 4).
- "servingsUnit": z. B. "Portionen", "Stück", "Brote", "Personen".
- "timeOverview": knappe 1-2 Sätze, wie viel Zeit pro Tag/Abschnitt eingeplant werden muss. Nur befüllen, wenn sich das aus der Seite sinnvoll ableiten lässt, sonst null.
- "amount": wenn keine klare Zahl vorhanden ist (z. B. "etwas", "nach Geschmack", "1 Prise"), setze amount auf null und beschreibe die Menge im "unit"-Feld.
- "group": NUR setzen, wenn die Zutat laut Seite explizit zu einem separaten Teilrezept gehört (z. B. "Quellstück", "Vorteig", "Hauptteig", "Brühstück", "Poolish"); normale Hauptteig-Zutaten ohne genannte Zugehörigkeit bekommen null.
- "day": NUR beim ERSTEN Schritt eines neuen Tages/Abschnitts setzen (z. B. "Tag 1", "Tag 2"); alle folgenden Schritte desselben Tages bekommen null.
- Fasse "steps" prägnant zusammen, maximal 12 Schritte, keine Werbetexte, Anekdoten oder Vorworte übernehmen.
- Erfinde keine Zutaten, Schritte, Gruppen oder Tage, die nicht auf der Seite stehen.
- Wenn du den Seiteninhalt nicht finden oder das Rezept nicht sicher extrahieren kannst, antworte ausschließlich mit {"error": "not_found"} statt zu raten.`;

async function fetchRecipeFromUrl(url) {
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      system: URL_PARSE_SYSTEM_PROMPT,
      messages: [{ role: "user", content: `Rezept-URL: ${url}` }],
      tools: [{ type: "web_search_20250305", name: "web_search" }],
    }),
  });
  if (!response.ok) throw new Error("API-Fehler");
  const data = await response.json();
  const textBlocks = (data.content || [])
    .filter((b) => b.type === "text")
    .map((b) => b.text)
    .join("\n");
  const cleaned = textBlocks.replace(/```json|```/g, "").trim();
  const parsed = JSON.parse(cleaned);
  if (!parsed || typeof parsed !== "object") throw new Error("Ungültige Antwort");
  if (parsed.error) return null;
  return parsed;
}

function titleFromUrl(url) {
  try {
    const u = new URL(url);
    const parts = u.pathname.split("/").filter(Boolean);
    const last = parts[parts.length - 1] || u.hostname.replace(/^www\./, "");
    const cleaned = last
      .replace(/\.(html?|php)$/i, "")
      .replace(/[-_]+/g, " ")
      .trim();
    if (!cleaned) return "Neues Rezept";
    return cleaned.replace(/\b\w/g, (c) => c.toUpperCase());
  } catch (e) {
    return "Neues Rezept";
  }
}

/* ------------------------------------------------------------------ */
/* Storage-Layer: echtes Browser-localStorage statt window.storage.     */
/* Funktioniert zuverlässig, sobald diese Datei direkt im Browser       */
/* geöffnet wird (nicht in einer Sandbox-Vorschau). Async-Signaturen    */
/* bleiben erhalten, damit der restliche Code unverändert bleibt.       */
/* ------------------------------------------------------------------ */

async function storageGetJSON(key) {
  try {
    const raw = localStorage.getItem(key);
    if (raw == null) return null;
    return JSON.parse(raw);
  } catch (e) {
    return null;
  }
}

async function storageSetJSON(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
}

// localStorage ist in einem normalen Browser-Tab sofort und synchron
// verfügbar – kein Warten auf eine Bridge nötig. Ein kurzer Schreib-Test
// deckt trotzdem seltene Fälle ab (z. B. manche private Browser-Modi mit
// deaktiviertem Storage).
async function waitForStorage() {
  try {
    const testKey = "__storage_test__";
    localStorage.setItem(testKey, "1");
    localStorage.removeItem(testKey);
    return true;
  } catch (e) {
    return false;
  }
}

// Direkter Diagnose-Test: schreibt, liest und löscht einen Wegwerf-Key und
// gibt die rohe Fehlermeldung zurück, falls localStorage nicht funktioniert.
async function runStorageDiagnostic() {
  const key = "diag-" + Date.now().toString(36);
  try {
    localStorage.setItem(key, "ping");
    const val = localStorage.getItem(key);
    localStorage.removeItem(key);
    if (val === "ping") {
      return { ok: true, message: "Schreiben & Lesen erfolgreich (localStorage)." };
    }
    return { ok: false, message: "Geschrieben, aber beim Lesen kam ein unerwarteter Wert zurück: " + String(val) };
  } catch (e) {
    return { ok: false, message: (e && e.message ? e.message : String(e)) };
  }
}

// Reine Formular-Logik (ohne eigenen Header) – wird von AddRecipeView und
// EditRecipeView eingebettet, damit beide sich einen Header/Zurück-Button teilen können.
function RecipeFormBody({ mode, initial, categories, onAddCategory, onSave, onCancel, prefillSourceUrl }) {
  const [form, setForm] = useState(() =>
    initial
      ? {
          title: initial.title,
          author: initial.author || "",
          category: initial.category,
          sourceUrl: initial.sourceUrl || "",
          notes: initial.notes || "",
          baseServings: initial.baseServings,
          servingsUnit: initial.servingsUnit,
          hydration: initial.hydration ?? null,
          doughWeight: initial.doughWeight ?? null,
          timeOverview: initial.timeOverview || "",
          ingredients: initial.ingredients.map((i) => {
            const n = normalizeIngredient(i);
            return { ...n, group: n.group || "" };
          }),
          steps: initial.steps.map((s) => {
            const n = normalizeStep(s);
            return { text: n.text, day: n.day || "" };
          }),
        }
      : buildEmptyForm(categories, prefillSourceUrl)
  );
  const [addingCategory, setAddingCategory] = useState(false);
  const [newCategoryDraft, setNewCategoryDraft] = useState("");

  function update(patch) {
    setForm((f) => ({ ...f, ...patch }));
  }

  function applyParsed(parsed) {
    const catMatch = categories.find(
      (c) => c.toLowerCase() === String(parsed.category || "").toLowerCase()
    );
    const ingredients =
      Array.isArray(parsed.ingredients) && parsed.ingredients.length > 0
        ? parsed.ingredients.map((i) => ({
            id: uid("ing"),
            amount: i.amount === null || i.amount === undefined || i.amount === "" ? null : Number(i.amount),
            unit: i.unit ? String(i.unit) : "",
            name: i.name ? String(i.name) : "",
            group: i.group ? String(i.group) : "",
          }))
        : form.ingredients;
    const steps =
      Array.isArray(parsed.steps) && parsed.steps.length > 0
        ? parsed.steps.map((s) =>
            typeof s === "object" && s !== null
              ? { text: String(s.text || ""), day: s.day ? String(s.day) : "" }
              : { text: String(s), day: "" }
          )
        : form.steps;
    setForm({
      title: parsed.title ? String(parsed.title) : form.title,
      author: parsed.author ? String(parsed.author) : form.author,
      category: catMatch || form.category,
      sourceUrl: form.sourceUrl,
      notes: form.notes,
      baseServings: Number(parsed.baseServings) > 0 ? Number(parsed.baseServings) : form.baseServings,
      servingsUnit: parsed.servingsUnit ? String(parsed.servingsUnit) : form.servingsUnit,
      hydration: calcHydration(ingredients) ?? form.hydration,
      doughWeight: calcDoughWeight(ingredients) ?? form.doughWeight,
      timeOverview: parsed.timeOverview ? String(parsed.timeOverview) : form.timeOverview,
      ingredients,
      steps,
    });
  }

  function addIngredient() {
    update({ ingredients: [...form.ingredients, { id: uid("ing"), amount: null, unit: "", name: "", group: "" }] });
  }
  function updateIngredient(id, patch) {
    update({ ingredients: form.ingredients.map((i) => (i.id === id ? { ...i, ...patch } : i)) });
  }
  function removeIngredient(id) {
    update({ ingredients: form.ingredients.filter((i) => i.id !== id) });
  }

  function addStep() {
    update({ steps: [...form.steps, { text: "", day: "" }] });
  }
  function updateStep(idx, patch) {
    const steps = [...form.steps];
    steps[idx] = { ...steps[idx], ...patch };
    update({ steps });
  }
  function removeStep(idx) {
    update({ steps: form.steps.filter((_, i) => i !== idx) });
  }

  function submitNewCategory() {
    const name = newCategoryDraft.trim();
    if (name) {
      onAddCategory(name);
      update({ category: name });
    }
    setNewCategoryDraft("");
    setAddingCategory(false);
  }

  function handleSubmit(e) {
    e.preventDefault();
    if (!form.title.trim()) return;
    const cleanIngredients = form.ingredients
      .filter((i) => i.name.trim())
      .map((i) => ({
        ...i,
        name: i.name.trim(),
        unit: (i.unit || "").trim(),
        group: (i.group || "").trim() || null,
      }));
    const cleanSteps = form.steps
      .map((s) => ({ text: (s.text || "").trim(), day: (s.day || "").trim() || null }))
      .filter((s) => s.text);
    onSave({
      title: form.title.trim(),
      author: (form.author || "").trim(),
      category: form.category,
      sourceUrl: form.sourceUrl.trim(),
      notes: form.notes.trim(),
      baseServings: Number(form.baseServings) > 0 ? Number(form.baseServings) : 1,
      servingsUnit: form.servingsUnit.trim() || "Portionen",
      hydration: form.hydration === "" || form.hydration == null ? null : Number(form.hydration),
      doughWeight: form.doughWeight === "" || form.doughWeight == null ? null : Number(form.doughWeight),
      timeOverview: (form.timeOverview || "").trim(),
      ingredients: cleanIngredients,
      steps: cleanSteps,
    });
  }

  const accentColor = categoryColor(form.category);

  return (
      <form onSubmit={handleSubmit} className="max-w-xl mx-auto px-4 py-4 pb-28">
        {mode === "add" && <AIParsePanel onApply={applyParsed} />}

        <label style={{ fontFamily: FONTS.mono, color: COLORS.inkSoft }} className="text-[11px] uppercase tracking-wide">

            {!addingCategory ? (
              <select

function ModeToggle({ mode, setMode }) {
  const pill = (active) =>
    active
      ? { background: COLORS.accent, color: COLORS.ink, fontFamily: FONTS.mono }
      : { border: `1px solid ${COLORS.card}`, color: COLORS.card, fontFamily: FONTS.mono };
  return (
    <div className="max-w-xl mx-auto px-4 pb-3 flex gap-2">
      <button onClick={() => setMode("link")} className="rk-focus px-3 py-1 rounded-full text-xs" style={pill(mode === "link")}>
        Per Link
      </button>
      <button onClick={() => setMode("manual")} className="rk-focus px-3 py-1 rounded-full text-xs" style={pill(mode === "manual")}>
        Manuell / Text
      </button>
    </div>
  );
}

function AddRecipeView({ categories, onAddCategory, onCreate, onCancel }) {
  const [mode, setMode] = useState("link");
  const [url, setUrl] = useState("");
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState("");

  async function handleSubmitUrl(rawUrl) {
    const trimmed = rawUrl.trim();
    if (!trimmed || loading) return;
    setLoading(true);
    setError("");
    let parsed = null;
    try {
      parsed = await fetchRecipeFromUrl(trimmed);
    } catch (e) {
      parsed = null;
    }
    setLoading(false);

    const catMatch = parsed && categories.find((c) => c.toLowerCase() === String(parsed.category || "").toLowerCase());
    const parsedIngredients =
      parsed && Array.isArray(parsed.ingredients) && parsed.ingredients.length > 0
        ? parsed.ingredients.map((i) => ({
            id: uid("ing"),
            amount: i.amount === null || i.amount === undefined || i.amount === "" ? null : Number(i.amount),
            unit: i.unit ? String(i.unit) : "",
            name: i.name ? String(i.name) : "",
            group: i.group ? String(i.group) : null,
          }))
        : [];
    const parsedSteps =
      parsed && Array.isArray(parsed.steps) && parsed.steps.length > 0
        ? parsed.steps.map((s) =>
            typeof s === "object" && s !== null
              ? { text: String(s.text || ""), day: s.day ? String(s.day) : null }
              : { text: String(s), day: null }
          )
        : [];
    const recipeData = {
      title: parsed && parsed.title ? String(parsed.title) : titleFromUrl(trimmed),
      author: parsed && parsed.author ? String(parsed.author) : "",
      category: catMatch || categories[0] || "Kochen",
      sourceUrl: trimmed,
      notes: "",
      baseServings: parsed && Number(parsed.baseServings) > 0 ? Number(parsed.baseServings) : 4,
      servingsUnit: parsed && parsed.servingsUnit ? String(parsed.servingsUnit) : "Portionen",
      hydration: calcHydration(parsedIngredients),
      doughWeight: calcDoughWeight(parsedIngredients),
      timeOverview: parsed && parsed.timeOverview ? String(parsed.timeOverview) : "",
      ingredients: parsedIngredients,
      steps: parsedSteps,
    };

    if (!parsed) {
      setError(
        "Konnte das Rezept nicht automatisch laden (passiert bei Seiten mit viel Text/Kommentaren). Ich lege trotzdem einen Eintrag mit dem Link an. Tipp: Schick mir den Link im Chat – ich lese die Seite direkt und liefere dir den Text zum Einfügen über \"Manuell / Text\"."
      );
    }
    onCreate(recipeData, !parsed);
  }

  return (
    <div className="rk-fade">
      <div className="sticky top-0 z-10" style={{ background: COLORS.kochen }}>
        <div className="max-w-xl mx-auto px-4 py-3 flex items-center gap-3">
          <IconButton onClick={onCancel} label="Zurück" style={{ color: COLORS.card }}>
            <ArrowLeft size={18} />
          </IconButton>
          <h1 style={{ fontFamily: FONTS.display, color: COLORS.card }} className="text-lg font-semibold flex-1">
            Neues Rezept
          </h1>
        </div>
        <ModeToggle mode={mode} setMode={setMode} />
      </div>

      {mode === "link" ? (
        <LinkAddBody
          url={url}
          setUrl={setUrl}
          onSubmit={handleSubmitUrl}
          loading={loading}
          error={error}
          onSwitchManual={() => setMode("manual")}
        />
      ) : (
        <RecipeFormBody
          mode="add"
          initial={null}
          categories={categories}
          onAddCategory={onAddCategory}
          onSave={(data) => onCreate(data, false)}
          onCancel={onCancel}
          prefillSourceUrl={url}
        />
      )}
    </div>
  );
}

function NumericStepper({ value, onChange, step, min, width }) {
  return (
    <div className="flex items-center gap-1">
      <IconButton
        onClick={() => onChange(Math.max(min ?? 0, Math.round((value - step) * 10) / 10))}
        label="Weniger"
        style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
        className="w-7 h-7 flex items-center justify-center p-0 shrink-0"
      >
        <Minus size={13} />
      </IconButton>
      <input
        type="number"
        value={value}
        onChange={(e) => onChange(Number(e.target.value) || 0)}
        className={"rk-focus text-center rounded-md py-1 " + (width || "w-16")}
        style={{ ...INPUT_STYLE, fontFamily: FONTS.mono }}
      />
      <IconButton
        onClick={() => onChange(Math.round((value + step) * 10) / 10)}
        label="Mehr"
        style={{ border: `1px solid ${COLORS.line}`, color: COLORS.ink }}
        className="w-7 h-7 flex items-center justify-center p-0 shrink-0"
      >
        <Plus size={13} />
      </IconButton>
    </div>

}

function ScalerRow({ label, value, suffix, step, min, onChange }) {
  return (
    <div className="flex items-center gap-2 flex-wrap">
      <span
        style={{ fontFamily: FONTS.mono, color: COLORS.inkSoft }}
        className="text-[11px] uppercase tracking-wide w-[5.5rem] shrink-0"
      >
        {label}
      </span>
      <NumericStepper value={value} onChange={onChange} step={step} min={min} width="w-16" />
      <span style={{ fontFamily: FONTS.mono, color: COLORS.inkSoft }} className="text-xs">
        {suffix}
      </span>
    </div>
  );
}

function RecipeScaler({
  recipe,
  ingredients,
  flourFactor,
  displayServings,
  displayDoughWeight,
  targetHydration,
  onServingsChange,
  onDoughWeightChange,
  onHydrationChange,
  onReset,
}) {
  const doughWeightAvailable = recipe.doughWeight != null || calcDoughWeight(ingredients) != null;
  const hydrationAvailable = recipe.hydration != null || calcHydration(ingredients) != null;
  const baseHydration = recipe.hydration ?? calcHydration(ingredients);
  const isBase = Math.abs(flourFactor - 1) < 1e-6 && targetHydration === baseHydration;

  return (
    <div className="mb-1">
      <div className="flex items-center justify-between mb-2">
        <span style={{ fontFamily: FONTS.mono, color: COLORS.inkSoft }} className="text-[11px] uppercase tracking-wide">
          Menge &amp; Teig
        </span>
        {!isBase && (
          <button onClick={onReset} className="rk-focus text-xs underline" style={{ color: COLORS.accent, fontFamily: FONTS.mono }}>
            zurücksetzen
          </button>
        )}
      </div>

      <div className="space-y-2">
        <ScalerRow
          label="Menge"
          value={Math.round(displayServings * 10) / 10}
          suffix={recipe.servingsUnit}
          step={1}
          min={0.1}
          onChange={onServingsChange}
        />
        {doughWeightAvailable && (
          <ScalerRow
            label="Teigmenge"
            value={displayDoughWeight != null ? displayDoughWeight : ""}
            suffix="g gesamt"
            step={50}
            min={1}
            onChange={onDoughWeightChange}
          />
        )}
        {hydrationAvailable && (
          <ScalerRow
            label="Hydration"
            value={targetHydration != null ? targetHydration : ""}
            suffix="% (nur Wasser)"
            step={1}
            min={0}
            onChange={onHydrationChange}
          />
        )}
      </div>
    </div>
  );
}

  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState({ amount: ing.amount, unit: ing.unit, name: ing.name });
  const scaled = scaledAmount != null ? formatAmount(scaledAmount) : null;
  const name = displayName || ing.name;

  if (editing) {
    return (
      <div className="py-2" style={{ borderBottom: `1px dashed ${COLORS.line}` }}>
        <div style={{ fontFamily: FONTS.mono, color: COLORS.inkSoft }} className="text-[10px] uppercase mb-1">
          Basismenge bearbeiten
        </div>
        <div className="flex gap-2">
          <input
            type="number"
            step="any"
            value={draft.amount ?? ""}
            onChange={(e) => setDraft({ ...draft, amount: e.target.value === "" ? null : Number(e.target.value) })}
            placeholder="Menge"
            className="rk-focus w-16 rounded-md px-2 py-1.5 text-sm"
            style={{ ...INPUT_STYLE, fontFamily: FONTS.mono }}
          />
          <input
            value={draft.unit}
            onChange={(e) => setDraft({ ...draft, unit: e.target.value })}

            style={{ ...INPUT_STYLE, fontFamily: FONTS.mono }}
          />
          <input
            value={draft.name}
            onChange={(e) => setDraft({ ...draft, name: e.target.value })}
            placeholder="Zutat"
            className="rk-focus flex-1 rounded-md px-3 py-1.5 text-sm min-w-0"
            style={INPUT_STYLE}
          />
        </div>
        <div className="flex gap-3 mt-2">
          <button
            onClick={() => {
              onSubstitute(ing.id, { ...draft, name: draft.name.trim(), unit: (draft.unit || "").trim() });

            style={{ background: COLORS.kochen, color: COLORS.card }}

            Speichern
          </button>
          <button
            onClick={() => setEditing(false)}
            className="rk-focus text-xs px-2.5 py-1 rounded-md"
            style={{ border: `1px solid ${COLORS.line}`, color: COLORS.inkSoft }}
          >
            Abbrechen
          </button>
        </div>

  return (
    <div className="flex items-center gap-2 py-1.5" style={{ borderBottom: `1px dashed ${COLORS.line}` }}>
      <button
        onClick={() => onToggleCheck(ing.id)}
        aria-label={checked ? "Als nicht bereitgestellt markieren" : "Als bereitgestellt markieren"}
        className="rk-focus shrink-0"
        style={{ color: checked ? accentColor : COLORS.inkSoft }}
      >
        <CheckCircle size={18} checked={checked} />

      <div
        style={{
          fontFamily: FONTS.mono,
          color: checked ? COLORS.inkSoft : COLORS.ink,
          textDecoration: checked ? "line-through" : "none",
        }}
        className="text-right text-sm shrink-0 whitespace-nowrap min-w-[3.5rem]"
      >
        {scaled != null ? `${scaled}${ing.unit ? " " + ing.unit : ""}` : ing.unit || ""}
      </div>
      <div
        style={{
          fontFamily: FONTS.body,
          color: checked ? COLORS.inkSoft : COLORS.ink,
          textDecoration: checked ? "line-through" : "none",
        }}
        className="flex-1 text-sm"
      >
        {name}
      </div>
      <IconButton onClick={() => setEditing(true)} label="Zutat ersetzen" style={{ color: COLORS.inkSoft }}>
        <ArrowLeftRight size={14} />
      </IconButton>
    </div>
  );
}

function UsageForm({ onSubmit, onCancel }) {
  const [date, setDate] = useState(todayInputValue());
  const [rating, setRating] = useState(8);
  const [comment, setComment] = useState("");
  const [photos, setPhotos] = useState([]);
  const [photoBusy, setPhotoBusy] = useState(false);
  const [photoError, setPhotoError] = useState("");
  const fileInputRef = useRef(null);
  const MAX_PHOTOS = 3;

  async function handleFiles(e) {
    const files = Array.from(e.target.files || []);
    e.target.value = "";
    if (files.length === 0) return;
    const room = Math.max(0, MAX_PHOTOS - photos.length);
    const toProcess = files.slice(0, room);
    setPhotoError(files.length > toProcess.length ? `Maximal ${MAX_PHOTOS} Fotos pro Eintrag.` : "");
    if (toProcess.length === 0) return;
    setPhotoBusy(true);
    try {
      const compressed = [];
      for (const f of toProcess) {
        compressed.push(await compressImageFile(f, 900, 0.7));
      }
      setPhotos((p) => [...p, ...compressed]);
    } catch (err) {
      setPhotoError("Foto konnte nicht verarbeitet werden.");
    } finally {
      setPhotoBusy(false);
    }
  }

  function removePhoto(idx) {
    setPhotos((p) => p.filter((_, i) => i !== idx));
  }

  return (
    <div className="rounded-lg p-3 mb-4" style={{ background: COLORS.cardAlt, border: `1px solid ${COLORS.line}` }}>
      <div className="flex gap-3 mb-3">
        <div className="flex-1">
          <label style={{ fontFamily: FONTS.mono, color: COLORS.inkSoft }} className="text-[10px] uppercase">
            Datum
          </label>
          <input
            type="date"
            value={date}
            onChange={(e) => setDate(e.target.value)}
            className="rk-focus w-full rounded-md px-2 py-1.5 text-sm mt-1"
            style={{ ...INPUT_STYLE, fontFamily: FONTS.mono }}
          />
        </div>
        <div className="w-28">
          <label style={{ fontFamily: FONTS.mono, color: COLORS.inkSoft }} className="text-[10px] uppercase">
            Bewertung: {rating}/10
          </label>
          <input
            type="range"
            min="1"
            max="10"
            value={rating}
            onChange={(e) => setRating(Number(e.target.value))}
            className="w-full mt-2.5"
          />
        </div>
      </div>
      <textarea
        value={comment}
        onChange={(e) => setComment(e.target.value)}
        rows={2}
        placeholder="Kommentar (was war gut, was würdest du ändern?)"
        className="rk-focus w-full rounded-md px-3 py-2 text-sm mb-3"
        style={INPUT_STYLE}
      />

      <label style={{ fontFamily: FONTS.mono, color: COLORS.inkSoft }} className="text-[10px] uppercase">
        Fotos (optional)
      </label>
      <div className="flex flex-wrap gap-2 mt-1.5 mb-1">
        {photos.map((src, idx) => (
          <div key={idx} className="relative">
            <img
              src={src}
              alt="Foto zum Rezept"
              className="w-14 h-14 object-cover rounded-md"
              style={{ border: `1px solid ${COLORS.line}` }}
            />
            <button
              type="button"
              onClick={() => removePhoto(idx)}
              aria-label="Foto entfernen"
              className="rk-focus absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full flex items-center justify-center"
              style={{ background: COLORS.danger, color: COLORS.card }}
            >
              <X size={11} />
            </button>
          </div>
        ))}
        {photos.length < MAX_PHOTOS && (
          <button
            type="button"
            onClick={() => fileInputRef.current && fileInputRef.current.click()}
            disabled={photoBusy}
            aria-label="Foto hinzufügen"
            className="rk-focus w-14 h-14 rounded-md flex items-center justify-center"
            style={{ border: `1px dashed ${COLORS.inkSoft}`, color: COLORS.inkSoft }}
          >
            {photoBusy ? <Loader2 size={16} className="animate-spin" /> : <Camera size={18} />}
          </button>
        )}
        <input
          ref={fileInputRef}
          type="file"
          accept="image/*"
          multiple
          onChange={handleFiles}
          style={{ display: "none" }}
        />
      </div>
      {photoError && (
        <p style={{ fontFamily: FONTS.body, color: COLORS.danger }} className="text-xs mb-2">
          {photoError}
        </p>
      )}

      <div className="flex gap-3 mt-2">
        <PrimaryButton
          onClick={() => onSubmit({ id: uid("use"), date, rating, comment: comment.trim(), photos })}
          color={COLORS.accent}
          textColor={COLORS.ink}
        >
          Speichern
        </PrimaryButton>
        <GhostButton onClick={onCancel}>Abbrechen</GhostButton>
      </div>
    </div>
  );
}

function DetailView({ recipe, onBack, onEdit, onDelete, onUpdateRecipe }) {
  const normIngredients = useMemo(() => recipe.ingredients.map(normalizeIngredient), [recipe.ingredients]);
  const normSteps = useMemo(() => recipe.steps.map(normalizeStep), [recipe.steps]);
  const baseHydration = recipe.hydration ?? calcHydration(normIngredients);
  const [flourFactor, setFlourFactor] = useState(1);
  const [targetHydration, setTargetHydration] = useState(baseHydration);
  const [checkedIngredients, setCheckedIngredients] = useState(() => new Set());
  const [checkedSteps, setCheckedSteps] = useState(() => new Set());
  const [showUsageForm, setShowUsageForm] = useState(false);
  const [confirmingDelete, setConfirmingDelete] = useState(false);
  const [editingNotes, setEditingNotes] = useState(false);
  const [notesDraft, setNotesDraft] = useState(recipe.notes || "");
  const [lightboxSrc, setLightboxSrc] = useState(null);

  const scaledIngredients = useMemo(
    () => computeScaledIngredientsV2(normIngredients, flourFactor, targetHydration),
    [normIngredients, flourFactor, targetHydration]
  );
  const displayServings = flourFactor * recipe.baseServings;
  const displayDoughWeight = useMemo(() => sumScaledGrams(scaledIngredients), [scaledIngredients]);
  const avg = computeAvgRating(recipe.usageLog);
  const color = categoryColor(recipe.category);

  function handleServingsChange(v) {
    if (recipe.baseServings > 0 && v > 0) setFlourFactor(v / recipe.baseServings);
  }
  function handleDoughWeightChange(v) {
    setFlourFactor(solveFlourFactorForDoughWeight(normIngredients, Number(v), targetHydration));
  }
  function handleHydrationChange(v) {
    setTargetHydration(Number(v));
  }
  function resetScaler() {
    setFlourFactor(1);
    setTargetHydration(baseHydration);
  }

  function toggleIngredientChecked(id) {
    setCheckedIngredients((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  }
  function toggleStepChecked(idx) {
    setCheckedSteps((prev) => {
      const next = new Set(prev);
      if (next.has(idx)) next.delete(idx);
      else next.add(idx);
      return next;
    });
  }

  function substituteIngredient(id, patch) {
    onUpdateRecipe({ ...recipe, ingredients: recipe.ingredients.map((i) => (i.id === id ? { ...i, ...patch } : i)) });
  }

  function addUsage(entry) {
    onUpdateRecipe({ ...recipe, usageLog: [entry, ...recipe.usageLog] });
    setShowUsageForm(false);
  }

  function deleteUsage(id) {
    onUpdateRecipe({ ...recipe, usageLog: recipe.usageLog.filter((e) => e.id !== id) });
  }

  function saveNotes() {
    onUpdateRecipe({ ...recipe, notes: notesDraft.trim() });
    setEditingNotes(false);
  }

  let sourceHost = "";
  try {
    if (recipe.sourceUrl) sourceHost = new URL(recipe.sourceUrl).hostname.replace(/^www\./, "");
  } catch (e) {
    sourceHost = recipe.sourceUrl;
  }

  return (
    <div className="rk-fade">
      <div className="sticky top-0 z-10" style={{ background: color }}>
        <div className="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
          <IconButton onClick={onBack} label="Zurück" style={{ color: COLORS.card }}>
            <ArrowLeft size={18} />
          </IconButton>
          <div className="flex items-center gap-1">
            <IconButton onClick={onEdit} label="Bearbeiten" style={{ color: COLORS.card }}>
              <Pencil size={17} />
            </IconButton>
            {!confirmingDelete ? (
              <IconButton onClick={() => setConfirmingDelete(true)} label="Löschen" style={{ color: COLORS.card }}>
                <Trash2 size={17} />
              </IconButton>
            ) : (
              <span className="flex items-center gap-1 text-xs" style={{ color: COLORS.card, fontFamily: FONTS.mono }}>
                <button onClick={onDelete} className="rk-focus underline">
                  löschen
                </button>
                <button onClick={() => setConfirmingDelete(false)} className="rk-focus underline">
                  abbr.
                </button>
              </span>
            )}
          </div>
        </div>
      </div>

      <div className="max-w-xl mx-auto px-4 py-4 pb-28">
        <div className="flex items-start justify-between gap-3 mb-2">
          <span
            style={{ fontFamily: FONTS.mono, color, background: categorySoft(recipe.category) }}
            className="text-[11px] px-2 py-0.5 rounded uppercase tracking-wide"
          >
            {recipe.category}
          </span>
          <StampBadge date={recipe.createdAt} />
        </div>

        <h1 style={{ fontFamily: FONTS.display, color: COLORS.ink }} className="text-2xl font-semibold leading-tight mb-1">
          {recipe.title}
        </h1>

        {recipe.author && (
          <p style={{ fontFamily: FONTS.body, color: COLORS.inkSoft }} className="text-sm mb-1">
            von {recipe.author}
          </p>
        )}

        {recipe.sourceUrl && (
          <a
            href={recipe.sourceUrl}
            target="_blank"
            rel="noopener noreferrer"
            className="rk-focus inline-flex items-center gap-1 text-xs mb-3"
            style={{ fontFamily: FONTS.mono, color: COLORS.inkSoft }}
          >
            <ExternalLink size={12} /> {sourceHost}
          </a>
        )}

        {recipe.timeOverview && (
          <div
            className="flex items-start gap-2 mb-4 px-3 py-2 rounded-lg text-xs"
            style={{ background: categorySoft(recipe.category), color, fontFamily: FONTS.mono }}
          >
            <Clock size={14} className="shrink-0 mt-0.5" />
            <span>{recipe.timeOverview}</span>
          </div>
        )}

        <div className="rounded-lg p-3 mb-4" style={{ background: COLORS.card, border: `1px solid ${COLORS.line}` }}>
          <div className="flex items-center justify-between mb-1">
            <span style={{ fontFamily: FONTS.mono, color: COLORS.inkSoft }} className="text-[10px] uppercase tracking-wide">
              Notizen
            </span>
            {!editingNotes && (
              <button onClick={() => setEditingNotes(true)} className="rk-focus" style={{ color: COLORS.inkSoft }}>
                <Pencil size={13} />
              </button>
            )}
          </div>
          {editingNotes ? (
            <div>
              <textarea
                value={notesDraft}
                onChange={(e) => setNotesDraft(e.target.value)}
                rows={3}
                className="rk-focus w-full rounded-md px-3 py-2 text-sm"
                style={INPUT_STYLE}
              />
              <div className="flex gap-3 mt-2">
                <button onClick={saveNotes} className="rk-focus text-xs px-2.5 py-1 rounded-md" style={{ background: COLORS.kochen, color: COLORS.card }}>
                  Speichern
                </button>
                <button
                  onClick={() => {
                    setNotesDraft(recipe.notes || "");
                    setEditingNotes(false);
                  }}
                  className="rk-focus text-xs px-2.5 py-1 rounded-md"
                  style={{ border: `1px solid ${COLORS.line}`, color: COLORS.inkSoft }}
                >
                  Abbrechen
                </button>
              </div>
            </div>
          ) : (
            <p style={{ fontFamily: FONTS.body, color: recipe.notes ? COLORS.ink : COLORS.inkSoft }} className="text-sm">
              {recipe.notes || "Keine Notizen."}
            </p>
          )}
        </div>

        <div className="mb-4">
          <RecipeScaler
            recipe={recipe}
            ingredients={normIngredients}
            flourFactor={flourFactor}
            displayServings={displayServings}
            displayDoughWeight={displayDoughWeight}
            targetHydration={targetHydration}
            onServingsChange={handleServingsChange}
            onDoughWeightChange={handleDoughWeightChange}
            onHydrationChange={handleHydrationChange}
            onReset={resetScaler}
          />
        </div>

        <div className="mb-5">
          {scaledIngredients.length === 0 ? (
            <p style={{ fontFamily: FONTS.body, color: COLORS.inkSoft }} className="text-sm">
              Keine Zutaten hinterlegt.
            </p>
          ) : (
            (() => {
              let currentGroup = null;
              return scaledIngredients.map((ing) => {
                let header = null;
                if (ing.group && ing.group !== currentGroup) {
                  currentGroup = ing.group;
                  header = currentGroup;
                } else if (!ing.group && currentGroup != null) {
                  currentGroup = null;
                }
                return (
                  <React.Fragment key={ing.id}>
                    {header && (
                      <div className="flex items-center gap-2 mt-3 mb-1.5 first:mt-0">
                        <span
                          style={{ fontFamily: FONTS.mono, color, background: categorySoft(recipe.category) }}
                          className="text-[10px] px-2 py-0.5 rounded uppercase tracking-wide shrink-0"
                        >
                          {header}
                        </span>
                        <div style={{ borderTop: `1px dashed ${COLORS.line}` }} className="flex-1" />
                      </div>
                    )}
                    <IngredientRow
                      ing={ing}
                      scaledAmount={ing.scaledAmount}
                      displayName={ing.name}
                      checked={checkedIngredients.has(ing.id)}
                      onToggleCheck={toggleIngredientChecked}
                      onSubstitute={substituteIngredient}
                      accentColor={color}
                    />
                  </React.Fragment>
                );
              });
            })()
          )}
        </div>

        <div className="mb-6">
          <span style={{ fontFamily: FONTS.body, color: COLORS.ink }} className="text-sm font-semibold block mb-2">
            Zubereitung
          </span>
          <div className="space-y-1">
            {(() => {
              let currentDay = null;
              return normSteps.map((step, idx) => {
                let header = null;
                if (step.day && step.day !== currentDay) {
                  currentDay = step.day;
                  header = currentDay;
                }
                const isChecked = checkedSteps.has(idx);
                return (
                  <React.Fragment key={idx}>
                    {header && (
                      <div className="flex items-center gap-2 mt-4 mb-2 first:mt-0">
                        <span
                          style={{ fontFamily: FONTS.mono, color: COLORS.card, background: color }}
                          className="text-[11px] px-2.5 py-1 rounded-full uppercase tracking-wide shrink-0"
                        >
                          {header}
                        </span>
                        <div style={{ borderTop: `1px dashed ${COLORS.line}` }} className="flex-1" />
                      </div>
                    )}
                    <button onClick={() => toggleStepChecked(idx)} className="rk-focus flex gap-3 w-full text-left py-1.5">
                      <div
                        style={{ fontFamily: FONTS.mono, color: COLORS.card, background: color, opacity: isChecked ? 0.5 : 1 }}
                        className="w-6 h-6 rounded-full flex items-center justify-center text-[11px] shrink-0 mt-0.5"
                      >
                        {idx + 1}
                      </div>
                      <p
                        style={{
                          fontFamily: FONTS.body,
                          color: isChecked ? COLORS.inkSoft : COLORS.ink,
                          textDecoration: isChecked ? "line-through" : "none",
                          lineHeight: 1.6,
                        }}
                        className="text-sm flex-1"
                      >
                        {step.text}
                      </p>
                    </button>
                  </React.Fragment>
                );
              });
            })()}
          </div>
        </div>

        <div>
          <div className="flex items-center justify-between mb-2">
            <span style={{ fontFamily: FONTS.body, color: COLORS.ink }} className="text-sm font-semibold">
              Bewertungen
            </span>
            <span style={{ fontFamily: FONTS.mono, color: COLORS.inkSoft }} className="text-xs">
              {avg != null ? `Ø ${avg}/10 · ${recipe.usageLog.length}× benutzt` : "Noch keine Bewertung"}
            </span>
          </div>

          {!showUsageForm ? (
            <PrimaryButton onClick={() => setShowUsageForm(true)} color={COLORS.accent} textColor={COLORS.ink}>
              Jetzt als benutzt markieren
            </PrimaryButton>
          ) : (
            <UsageForm onSubmit={addUsage} onCancel={() => setShowUsageForm(false)} />
          )}

          <div className="mt-3">
            {recipe.usageLog.length === 0 ? (
              <p style={{ fontFamily: FONTS.body, color: COLORS.inkSoft }} className="text-sm mt-2">
                Noch keine Nutzung protokolliert.
              </p>
            ) : (
              recipe.usageLog.map((entry) => (
                <UsageEntry key={entry.id} entry={entry} onDelete={deleteUsage} onOpenPhoto={setLightboxSrc} />
              ))
            )}
          </div>
        </div>
      </div>

      {lightboxSrc && (
        <div
          className="fixed inset-0 z-50 flex items-center justify-center p-4"
          style={{ background: "rgba(20,18,14,0.9)" }}
          onClick={() => setLightboxSrc(null)}
        >
          <img
            src={lightboxSrc}
            alt="Foto in voller Größe"
            className="max-w-full max-h-full rounded-md"
            style={{ objectFit: "contain" }}
          />
          <button
            onClick={() => setLightboxSrc(null)}
            aria-label="Schließen"
            className="rk-focus absolute top-4 right-4 w-9 h-9 rounded-full flex items-center justify-center"
            style={{ background: COLORS.card, color: COLORS.ink }}
          >
            <X size={18} />
          </button>
        </div>
      )}
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* Daten & Backup (Export/Import als zusätzliches Sicherheitsnetz, falls    */
/* localStorage im jeweiligen Browser doch einmal nicht verfügbar ist)     */
/* ------------------------------------------------------------------ */

function BackupView({ categories, recipes, storageStatus, storageDetail, onImport, onCancel }) {
  const [importText, setImportText] = useState("");
  const [importError, setImportError] = useState("");
  const [importSuccess, setImportSuccess] = useState("");
  const [copyState, setCopyState] = useState("");
  const [diagResult, setDiagResult] = useState("");
  const exportData = useMemo(() => JSON.stringify({ categories, recipes }, null, 2), [categories, recipes]);

  async function handleCopy() {
    try {
      await navigator.clipboard.writeText(exportData);
      setCopyState("In Zwischenablage kopiert.");
    } catch (e) {
      setCopyState("Kopieren automatisch nicht möglich – Text unten antippen, alles markieren, manuell kopieren.");
    }
  }

  function handleImport() {
    setImportError("");
    setImportSuccess("");
    try {
      const parsed = JSON.parse(importText);
      if (!parsed || !Array.isArray(parsed.recipes)) throw new Error("Kein gültiges Backup-Format (recipes fehlt).");
      onImport({
        categories: Array.isArray(parsed.categories) && parsed.categories.length ? parsed.categories : DEFAULT_CATEGORIES,
        recipes: parsed.recipes,
      });
      setImportSuccess(`${parsed.recipes.length} Rezept(e) übernommen.`);
      setImportText("");
    } catch (e) {
      setImportError("Konnte den Text nicht lesen: " + (e && e.message ? e.message : String(e)));
    }
  }

  const statusLabel =
    {
      saved: "Automatisch gespeichert",
      saving: "Speichert…",
      unavailable: "Nicht verfügbar – nur diese Sitzung",
      idle: "Wird geprüft…",
    }[storageStatus] || storageStatus;
  const statusColor = storageStatus === "saved" ? COLORS.kochen : storageStatus === "unavailable" ? COLORS.danger : COLORS.inkSoft;

  return (
    <div className="rk-fade">
      <div className="sticky top-0 z-10" style={{ background: COLORS.kochen }}>
        <div className="max-w-xl mx-auto px-4 py-3 flex items-center gap-3">
          <IconButton onClick={onCancel} label="Zurück" style={{ color: COLORS.card }}>
            <ArrowLeft size={18} />
          </IconButton>
          <h1 style={{ fontFamily: FONTS.display, color: COLORS.card }} className="text-lg font-semibold">
            Daten &amp; Backup
          </h1>
        </div>
      </div>

      <div className="max-w-xl mx-auto px-4 py-4 pb-28">
        <div className="rounded-lg p-3 mb-5" style={{ background: COLORS.cardAlt, border: `1px solid ${COLORS.line}` }}>
          <div className="flex items-center gap-2 text-xs" style={{ fontFamily: FONTS.mono, color: statusColor }}>
            <span
              className="w-2 h-2 rounded-full shrink-0"
              style={{ background: statusColor }}
            />
            Auto-Speicher: {statusLabel}
          </div>
          {storageDetail && (
            <p style={{ fontFamily: FONTS.mono, color: COLORS.inkSoft }} className="text-xs mt-1">
              {storageDetail}
            </p>
          )}
          <p style={{ fontFamily: FONTS.body, color: COLORS.inkSoft }} className="text-xs mt-2">
            {recipes.length} Rezept(e) in dieser Sitzung. Wenn der Auto-Speicher nicht funktioniert, bleibt die
            Kartei nur so lange erhalten, wie diese App-Ansicht offen ist – nutze dann das Backup unten.
          </p>
          <div className="flex items-center gap-2 mt-2">
            <button
              onClick={async () => {
                setDiagResult("Teste…");
                const res = await runStorageDiagnostic();
                setDiagResult((res.ok ? "✓ " : "✗ ") + res.message);
              }}
              className="rk-focus text-xs underline"
              style={{ fontFamily: FONTS.mono, color: COLORS.inkSoft }}
            >
              Speicher-Test ausführen
            </button>
          </div>
          {diagResult && (
            <p style={{ fontFamily: FONTS.mono, color: COLORS.inkSoft }} className="text-xs mt-1">
              {diagResult}
            </p>
          )}
        </div>

        <h2 style={{ fontFamily: FONTS.body, color: COLORS.ink }} className="text-sm font-semibold mb-2">
          Exportieren
        </h2>
        <p style={{ fontFamily: FONTS.body, color: COLORS.inkSoft }} className="text-xs mb-2">
          Sichert alle Rezepte &amp; Kategorien als Text, z. B. zum Aufheben in einer Notiz-App.
        </p>
        <PrimaryButton onClick={handleCopy}>
          <span className="flex items-center gap-1.5">
            <Copy size={14} /> In Zwischenablage kopieren
          </span>
        </PrimaryButton>
        {copyState && (
          <p style={{ fontFamily: FONTS.body, color: COLORS.inkSoft }} className="text-xs mt-2">
            {copyState}
          </p>
        )}
        <textarea
          readOnly
          value={exportData}
          rows={6}
          onFocus={(e) => e.target.select()}
          className="rk-focus w-full rounded-md px-3 py-2 text-xs mt-3"
          style={{ ...INPUT_STYLE, fontFamily: FONTS.mono }}
        />

        <h2 style={{ fontFamily: FONTS.body, color: COLORS.ink }} className="text-sm font-semibold mb-2 mt-6">
          Importieren
        </h2>
        <p style={{ fontFamily: FONTS.body, color: COLORS.inkSoft }} className="text-xs mb-2">
          Fügt gesicherten Text wieder ein und ersetzt die aktuelle Kartei in dieser Sitzung.
        </p>
        <textarea
          value={importText}
          onChange={(e) => setImportText(e.target.value)}
          rows={6}
          placeholder="Backup-Text hier einfügen…"
          className="rk-focus w-full rounded-md px-3 py-2 text-xs mb-2"
          style={{ ...INPUT_STYLE, fontFamily: FONTS.mono }}
        />
        {importError && (
          <p style={{ fontFamily: FONTS.body, color: COLORS.danger }} className="text-xs mb-2">
            {importError}
          </p>
        )}
        {importSuccess && (
          <p style={{ fontFamily: FONTS.body, color: COLORS.kochen }} className="text-xs mb-2">
            {importSuccess}
          </p>
        )}
        <PrimaryButton onClick={handleImport} color={COLORS.accent} textColor={COLORS.ink} disabled={!importText.trim()}>
          Importieren
        </PrimaryButton>
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/* App-Root                                                             */
/* ------------------------------------------------------------------ */

function App() {
  const [loading, setLoading] = useState(true);
  const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
  const [recipes, setRecipes] = useState([]);
  const [storageStatus, setStorageStatus] = useState("idle"); // idle | saving | saved | unavailable
  const [storageDetail, setStorageDetail] = useState("");
  const [notice, setNotice] = useState("");
  const [view, setView] = useState("list"); // list | add | edit | detail | backup
  const [currentRecipeId, setCurrentRecipeId] = useState(null);
  const [activeCategory, setActiveCategory] = useState("Alle");
  const [search, setSearch] = useState("");
  const [sortBy, setSortBy] = useState("date-desc");

  // Alles lebt ab jetzt vollständig im React-State (ein einziges Array mit
  // kompletten Rezeptobjekten statt Index+Einzel-Keys). localStorage wird
  // nur noch als Best-Effort-Sync im Hintergrund angesprochen – schlägt das
  // fehl, funktioniert die App innerhalb der Sitzung trotzdem vollständig,
  // und Daten & Backup bietet Export/Import als verlässlichen Ausweg.
  const currentRecipe = useMemo(() => recipes.find((r) => r.id === currentRecipeId) || null, [recipes, currentRecipeId]);

  const normTitle = (t) => (t || "").trim().toLowerCase();

  function buildRecipeFromPending(p) {
    return {
      id: uid("recipe"),
      title: p.title,
      author: p.author || "",
      category: p.category,
      sourceUrl: p.sourceUrl,
      notes: p.notes || "",
      baseServings: p.baseServings,
      servingsUnit: p.servingsUnit,
      hydration: p.hydration != null ? p.hydration : calcHydration(p.ingredients),
      doughWeight: p.doughWeight != null ? p.doughWeight : calcDoughWeight(p.ingredients),
      timeOverview: p.timeOverview || "",
      ingredients: p.ingredients.map((i) => ({ id: uid("ing"), ...i })),
      steps: [...p.steps],
      createdAt: new Date().toISOString(),
      usageLog: [],
    };
  }

  async function saveAll(cats, recs) {
    setStorageStatus("saving");
    try {
      await storageSetJSON(DATA_KEY, { categories: cats, recipes: recs });
      setStorageStatus("saved");
      setStorageDetail("");
    } catch (e) {
      setStorageStatus("unavailable");
      setStorageDetail(e && e.message ? e.message : String(e));
    }
  }

  useEffect(() => {
    let cancelled = false;
    async function load() {
      setLoading(true);
      const ready = await waitForStorage();

      let loaded = null;
      if (ready) {
        loaded = await storageGetJSON(DATA_KEY);
      }
      if (cancelled) return;

      const cats =
        loaded && Array.isArray(loaded.categories) && loaded.categories.length ? loaded.categories : DEFAULT_CATEGORIES;
      const recs = loaded && Array.isArray(loaded.recipes) ? loaded.recipes : [];

      const pendingImports = await loadPendingImports();
      const existingUrls = new Set(recs.map((r) => r.sourceUrl).filter(Boolean));
      const existingTitles = new Set(recs.map((r) => normTitle(r.title)));
      const toSeed = pendingImports.filter(
        (p) => !existingUrls.has(p.sourceUrl) && !existingTitles.has(normTitle(p.title))
      );
      const seeded = toSeed.map(buildRecipeFromPending);
      const finalRecipes = [...seeded, ...recs];

      setCategories(cats);
      setRecipes(finalRecipes);
      setLoading(false);

      if (!ready) {
        setStorageStatus("unavailable");
        setStorageDetail("localStorage ist in diesem Browser-Kontext nicht verfügbar (z. B. manche privaten Modi).");
      } else {
        saveAll(cats, finalRecipes);
      }
    }
    load();
    return () => {
      cancelled = true;
    };
  }, []);

  function persist(nextCategories, nextRecipes) {
    setCategories(nextCategories);
    setRecipes(nextRecipes);
    saveAll(nextCategories, nextRecipes);
  }

  function handleAddCategory(name) {
    if (!name || categories.includes(name)) return;
    persist([...categories, name], recipes);
  }

  function openRecipe(id) {
    setNotice("");
    setCurrentRecipeId(id);
    setView("detail");
  }

  function handleCreate(data) {
    const recipe = { id: uid("recipe"), ...data, createdAt: new Date().toISOString(), usageLog: [] };
    persist(categories, [recipe, ...recipes]);
    setCurrentRecipeId(recipe.id);
    setView("detail");
  }

  function handleCreateFromAdd(data, wasFallback) {
    setNotice("");
    handleCreate(data);
    if (wasFallback) {
      setNotice(
        "Konnte das Rezept nicht automatisch laden. Tipp: Schick mir den Link im Chat – ich lese die Seite direkt und liefere dir den Text zum Einfügen über \"Manuell / Text\"."
      );
    }
  }

  function handleUpdate(data) {
    const updated = { ...currentRecipe, ...data };
    persist(
      categories,
      recipes.map((r) => (r.id === updated.id ? updated : r))
    );
    setView("detail");
  }

  function handleUpdateRecipeInPlace(updatedRecipe) {
    persist(
      categories,
      recipes.map((r) => (r.id === updatedRecipe.id ? updatedRecipe : r))
    );
  }

  function handleDelete() {
    if (!currentRecipe) return;
    persist(
      categories,
      recipes.filter((r) => r.id !== currentRecipe.id)
    );
    setCurrentRecipeId(null);
    setView("list");
  }

  function handleImportBackup({ categories: importedCats, recipes: importedRecs }) {
    persist(importedCats, importedRecs);
  }

  const listItems = useMemo(
    () =>
      recipes.map((r) => ({
        id: r.id,
        title: r.title,
        author: r.author || "",
        category: r.category,
        createdAt: r.createdAt,
        sourceUrl: r.sourceUrl || "",
        timeOverview: r.timeOverview || "",
        avgRating: computeAvgRating(r.usageLog),
        usageCount: r.usageLog.length,
      })),
    [recipes]
  );

  const filtered = useMemo(() => {
    let list = listItems;
    if (activeCategory !== "Alle") list = list.filter((r) => r.category === activeCategory);
    if (search.trim()) {
      const q = search.trim().toLowerCase();
      list = list.filter((r) => r.title.toLowerCase().includes(q));
    }
    const sorted = [...list].sort((a, b) => {
      if (sortBy === "date-asc") return new Date(a.createdAt) - new Date(b.createdAt);
      if (sortBy === "rating-desc") return (b.avgRating ?? -1) - (a.avgRating ?? -1);
      if (sortBy === "name-asc") return a.title.localeCompare(b.title, "de");
      return new Date(b.createdAt) - new Date(a.createdAt);
    });
    return sorted;
  }, [listItems, activeCategory, search, sortBy]);

  if (loading) {
    return (
      <div
        style={{ background: COLORS.bg, minHeight: "100vh", fontFamily: FONTS.body, color: COLORS.inkSoft }}
        className="flex items-center justify-center"
      >
        <GlobalStyle />
        <div className="flex items-center gap-2 text-sm">
          <Loader2 size={16} className="animate-spin" /> Lade Rezeptkartei…
        </div>
      </div>
    );
  }

  return (
    <div style={{ background: COLORS.bg, minHeight: "100vh", fontFamily: FONTS.body }}>
      <GlobalStyle />

      {notice && (
        <div
          className="max-w-xl mx-auto mt-2 mx-4 px-3 py-2 rounded-md text-xs flex items-center justify-between"
          style={{ background: COLORS.accentSoft, color: COLORS.ink, border: `1px solid ${COLORS.accent}`, fontFamily: FONTS.body }}
        >
          <span>{notice}</span>
          <button onClick={() => setNotice("")} className="rk-focus" aria-label="Schließen">
            <X size={14} />
          </button>
        </div>
      )}

      {storageStatus === "unavailable" && view !== "backup" && (
        <div
          className="max-w-xl mx-auto mt-2 mx-4 px-3 py-2 rounded-md text-xs flex items-center justify-between gap-2"
          style={{ background: COLORS.danger, color: COLORS.card, fontFamily: FONTS.body }}
        >
          <span>Auto-Speicher nicht verfügbar – Kartei gilt nur für diese Sitzung. Backup nutzen!</span>
          <button onClick={() => setView("backup")} className="rk-focus underline shrink-0" style={{ fontFamily: FONTS.mono }}>
            Backup
          </button>
        </div>
      )}

      {view === "list" && (
        <ListView
          categories={categories}
          recipes={filtered}
          allCount={recipes.length}
          onOpen={openRecipe}
          onAdd={() => {
            setNotice("");
            setView("add");
          }}
          onAddCategory={handleAddCategory}
          activeCategory={activeCategory}
          setActiveCategory={setActiveCategory}
          search={search}
          setSearch={setSearch}
          sortBy={sortBy}
          setSortBy={setSortBy}
          onOpenBackup={() => setView("backup")}
          storageStatus={storageStatus}
        />
      )}

      {view === "add" && (
        <AddRecipeView
          categories={categories}
          onAddCategory={handleAddCategory}
          onCreate={handleCreateFromAdd}
          onCancel={() => setView("list")}
        />
      )}

      {view === "edit" && currentRecipe && (
        <EditRecipeView
          initial={currentRecipe}
          categories={categories}
          onAddCategory={handleAddCategory}
          onSave={handleUpdate}
          onCancel={() => setView("detail")}
        />
      )}

      {view === "detail" && currentRecipe && (
        <DetailView
          recipe={currentRecipe}
          onBack={() => {
            setView("list");
            setCurrentRecipeId(null);
            setNotice("");
          }}
          onEdit={() => setView("edit")}
          onDelete={handleDelete}
          onUpdateRecipe={handleUpdateRecipeInPlace}
        />
      )}

      {view === "backup" && (
        <BackupView
          categories={categories}
          recipes={recipes}
          storageStatus={storageStatus}
          storageDetail={storageDetail}
          onImport={(data) => {
            handleImportBackup(data);
            setView("list");
          }}
          onCancel={() => setView("list")}
        />
      )}
    </div>
  );
}

const rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(<App />);
</script>
</body>
</html>
